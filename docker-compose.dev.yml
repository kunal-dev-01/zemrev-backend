version: '3.8'

services:
  api-gateway:
    build:
      context: ./services/api-gateway
      dockerfile: Dockerfile.dev
    container_name: api-gateway-dev
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: development
      LOG_LEVEL: debug
      AUTH_SERVICE_URL: http://auth-service:5001
      CREDIT_SERVICE_URL: http://credit-service:5003
      USER_SERVICE_URL: http://user-service:5002
    env_file:
      - ./services/api-gateway/.env
    volumes:
      - ./services/api-gateway/src:/app/src
      - ./services/api-gateway/node_modules:/app/node_modules
    depends_on:
      - auth-service
      - credit-service
      - user-service
    networks:
      - backend-dev
    stdin_open: true
    tty: true

  auth-service:
    build:
      context: ./services/auth-service
      dockerfile: Dockerfile.dev
    container_name: auth-service-dev
    ports:
      - "5001:5001"
    environment:
      NODE_ENV: development
      LOG_LEVEL: debug
      PORT: 5001
    env_file:
      - ./services/auth-service/.env
    volumes:
      - ./services/auth-service/src:/app/src
      - ./services/auth-service/node_modules:/app/node_modules
    networks:
      - backend-dev
    stdin_open: true
    tty: true

  credit-service:
    build:
      context: ./services/credit-service
      dockerfile: Dockerfile.dev
    container_name: credit-service-dev
    ports:
      - "5003:5003"
    environment:
      NODE_ENV: development
      LOG_LEVEL: debug
      PORT: 5003
    env_file:
      - ./services/credit-service/.env
    volumes:
      - ./services/credit-service/src:/app/src
      - ./services/credit-service/node_modules:/app/node_modules
    networks:
      - backend-dev
    stdin_open: true
    tty: true

  user-service:
    build:
      context: ./services/user-service
      dockerfile: Dockerfile.dev
    container_name: user-service-dev
    ports:
      - "5002:5002"
    environment:
      NODE_ENV: development
      LOG_LEVEL: debug
      PORT: 5002
    env_file:
      - ./services/user-service/.env
    volumes:
      - ./services/user-service/src:/app/src
      - ./services/user-service/node_modules:/app/node_modules
    networks:
      - backend-dev
    stdin_open: true
    tty: true

networks:
  backend-dev:
    driver: bridge