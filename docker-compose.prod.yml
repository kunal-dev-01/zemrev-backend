version: '3.8'

services:
  api-gateway:
    build:
      context: .
      dockerfile: ./services/api-gateway/Dockerfile
    container_name: api-gateway-prod
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      LOG_LEVEL: info
      AUTH_SERVICE_URL: http://auth-service:5001
      CREDIT_SERVICE_URL: http://credit-service:5003
      USER_SERVICE_URL: http://user-service:5002
    env_file:
      - ./services/api-gateway/.env.production
    depends_on:
      - auth-service
      - credit-service
      - user-service
    networks:
      - backend
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  auth-service:
    build:
      context: .
      dockerfile: ./services/auth-service/Dockerfile
    container_name: auth-service-prod
    ports:
      - "5001:5001"
    environment:
      NODE_ENV: production
      LOG_LEVEL: info
      PORT: 5001
    env_file:
      - ./services/auth-service/.env.production
    networks:
      - backend
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  credit-service:
    build:
      context: .
      dockerfile: ./services/credit-service/Dockerfile
    container_name: credit-service-prod
    ports:
      - "5003:5003"
    environment:
      NODE_ENV: production
      LOG_LEVEL: info
      PORT: 5003
    env_file:
      - ./services/credit-service/.env.production
    networks:
      - backend
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5003/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  user-service:
    build:
      context: .
      dockerfile: ./services/user-service/Dockerfile
    container_name: user-service-prod
    ports:
      - "5002:5002"
    environment:
      NODE_ENV: production
      LOG_LEVEL: info
      PORT: 5002
    env_file:
      - ./services/user-service/.env.production
    networks:
      - backend
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  backend:
    driver: bridge